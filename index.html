<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRA 104 #8 - CHIANG KHONG</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- 🎆 สคริปต์พลุฉลองชัย (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #8e6d31; --primary-light: #b59451; --dark-bg: #000; --card-bg: rgba(255,255,255,0.08); }
        body { background-color: var(--dark-bg); color: #eee; font-family: 'Prompt', sans-serif; min-height: 100vh; padding-bottom: 120px; margin: 0; }
        .main-header { background: #000; border-bottom: 3px solid var(--primary); line-height: 0; cursor: pointer; }
        .logo-img { width: 100%; height: auto; display: block; }
        .nav-pills .nav-link { color: #aaa; border-radius: 50px; font-size: 0.85rem; }
        .nav-pills .nav-link.active { background-color: var(--primary); color: #000; font-weight: 600; }
        .card { border: 1px solid #444; border-radius: 20px; background: var(--card-bg); margin-bottom: 15px; }
        .bottom-dashboard { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 15, 15, 0.98); border-top: 2px solid var(--primary); padding: 10px 0; z-index: 1050; }
        .btn-dash-sm { background: transparent; border: none; color: #888; font-size: 0.7rem; width: 100%; }
        .btn-dash-sm i { font-size: 1.4rem; display: block; }
        #reader { width: 100%; border-radius: 15px; border: 2px solid var(--primary); background: #111; overflow:hidden; display: none; margin-bottom: 15px; }
        .btn-checkpoint { height: 60px; font-weight: 600; border-radius: 15px; margin-bottom: 8px; }
        .btn-pulse { animation: pulse-green 2s infinite; border: 2px solid #fff !important; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(40,167,69,0.7); } 70% { box-shadow: 0 0 0 15px rgba(40,167,69,0); } 100% { box-shadow: 0 0 0 0 rgba(40,167,69,0); } }
        #loading { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:none; justify-content:center; align-items:center; }
        .history-card { background: rgba(255,255,255,0.12); border-left: 5px solid var(--primary); padding: 12px; border-radius: 10px; margin-bottom: 12px; color: #fff; }
        .rank-gold { color: #ffd700; }
        /* 🎆 เอฟเฟกต์ตัวเลข 104 ขยายใหญ่ฉลองชัย */
        .celebrate-104 {
            animation: pop104 1.2s infinite alternate ease-in-out;
            color: #FFD700 !important;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.5);
        }
        @keyframes pop104 {
            0% { transform: scale(1); }
            100% { transform: scale(1.18); }
        }
    </style>
</head>
<body>

<div id="loading"><div class="spinner-border text-primary"></div></div>

<header class="main-header" onclick="handleLogoClick()"><img src="loco.png" alt="ULTRA 104" class="logo-img"></header>

<div class="container mt-3">
    <div class="text-center mb-3">
        <button class="btn btn-sm btn-outline-warning rounded-pill px-3" onclick="toggleMusic()">🎵 104 Song <i id="playIcon" class="bi bi-play-fill"></i></button>
        <audio id="bgMusic" src="104 song.mp3" loop></audio>
        <!-- 🎵 แท็กเสียงเพลง 104 Eng สำหรับหน้าผลงานส่วนตัว -->
        <audio id="engMusic" src="104 Eng.aac.mp3" loop></audio>
    </div>

    <ul class="nav nav-pills nav-fill mb-3 bg-dark p-1 rounded-pill shadow">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-scan">สแกนจุด</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-stat" onclick="loadRanking()">อันดับ</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-me" onclick="loadMyResult()">ผลงาน</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-reg">ลงทะเบียน</button></li>
    </ul>

    <div class="tab-content pb-5">
        <div class="tab-pane fade show active" id="tab-scan">
            <div class="card p-3 shadow-lg text-center">
                <div id="scanStep1">
                    <div class="input-group mb-3">
                        <input type="text" id="scanBib" class="form-control text-center bg-dark text-white border-secondary" placeholder="ระบุเลข BIB">
                        <button class="btn btn-warning fw-bold px-4" onclick="verifyStep1()">🔍 ยืนยัน BIB</button>
                    </div>
                </div>
                <div id="scanStep2" style="display:none;">
                    <h2 class="text-primary fw-bold mb-1" id="confirmName">---</h2>
                    <span class="badge bg-secondary mb-3 fs-6" id="confirmBibDisplay">BIB: ---</span>
                    <div id="runnerHistoryScan" class="text-start mb-4"></div>
                    <div class="d-grid gap-3">
                        <button class="btn btn-success btn-lg fw-bold py-3 rounded-4" onclick="unlockCPButtons()">✅ กดยืนยันข้อมูลถูกต้อง</button>
                        <button class="btn btn-outline-danger btn-sm border-0" onclick="cancelVerify()">❌ ยกเลิก</button>
                    </div>
                </div>
                <div id="scanStep3" style="display:none;">
                    <div class="alert alert-dark text-center fw-bold border-warning mb-3">🏁 บันทึกสำหรับ: <span id="activeRunnerName" class="text-warning"></span></div>
                    <div id="reader"></div>
                    <div class="d-grid" id="btnArea">
                        <button class="btn btn-dark btn-checkpoint" onclick="scanCP('Start', 0)">🚩 Start (กม.0)</button>
                        <button class="btn btn-secondary btn-checkpoint" disabled>📍 CP-1 (กม.7 - ผ่านเลี่ยงทางลอด)</button>
                        <button class="btn btn-success btn-checkpoint" onclick="scanCP('CP2', 56)">📍 CP-2 (กม.56)</button>
                        <button class="btn btn-success btn-checkpoint" onclick="scanCP('CP3', 72)">📍 CP-3 (กม.72)</button>
                        <button class="btn btn-success btn-checkpoint" onclick="scanCP('CP4', 89)">📍 CP-4 (กม.89)</button>
                        <button class="btn btn-success btn-checkpoint" onclick="scanCP('CP5', 103)">📍 CP-5 (กม.103)</button>
                        <button class="btn btn-danger btn-checkpoint" onclick="scanCP('CP6', 104)">🏁 Finish (กม.104)</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-stat">
            <div class="card p-3">
                <div class="mb-3">
                    <h6 class="fw-bold text-warning m-0 mb-2">Live Ranking 104 Km.</h6>
                    <select id="rankFilter" class="form-select form-select-sm bg-dark text-white border-secondary" onchange="filterRanking()">
                        <option value="All">ทุกประเภท</option>
                        <option value="Solo_M">Solo - ชาย (Male)</option>
                        <option value="Solo_F">Solo - หญิง (Female)</option>
                        <option value="Couple">ผลัด 2 (Couple)</option>
                        <option value="Team3">ผลัด 3 (Team 3)</option>
                        <option value="Team10">ผลัด 10 (Team 10)</option>
                    </select>
                </div>
                <div class="table-responsive small"><table class="table table-dark"><thead><tr><th>#</th><th>BIB</th><th>ชื่อ</th><th class="text-end">ระยะ</th></tr></thead><tbody id="rankingBody"></tbody></table></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-me">
            <div class="card p-4 text-center">
                <h5 class="fw-bold text-primary mb-3">ผลงานส่วนตัว</h5>
                
                <div class="input-group mb-3">
                    <input type="text" id="meBib" class="form-control text-center bg-dark text-white border-primary" placeholder="ใส่เลข BIB">
                    <button class="btn btn-warning fw-bold" onclick="loadMyResult()">สถิติ</button>
                </div>

                <div id="meContent" class="mt-4 text-start"></div>

                <div id="certArea" style="display:none;" class="mt-3">
                    <hr class="border-secondary my-4">
                    <h4 class="text-white fw-bold mb-1">🏆 CERTIFICATE OF ACHIEVEMENT</h4>
                    <p class="text-warning small mb-3">ใบประกาศเกียรติยศแสดงระยะทางที่คุณพิชิตได้</p>
                    <button onclick="generateCertificate()" class="btn btn-warning w-100 fw-bold py-3 shadow-sm" style="border-radius: 15px;">
                        🏅 รับใบเกียรติบัตรออนไลน์
                    </button>
                </div>

                <div id="certWrapper" style="display:none; text-align:center; margin-top:20px;">
                    <hr class="border-warning my-4" style="opacity: 0.5;">
                    <h5 class="text-warning fw-bold mb-3">✨ ใบเกียรติบัตรของคุณ ✨</h5>
                    
                    <canvas id="certCanvas" style="width: 100%; max-width: 600px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #FFD700;"></canvas>
                    
                    <p class="text-white-50 small mt-3">💡 กดค้างที่รูปเพื่อ "บันทึกรูปภาพ" ลงมือถือ</p>
                    <button onclick="location.reload()" class="btn btn-outline-light btn-sm mt-2">🔄 กลับไปหน้าหลัก</button>
                </div>
            </div> 
        </div>

        <!-- Registration Tab -->
        <div class="tab-pane fade" id="tab-reg">
            <div class="card p-4">
                <h5 class="fw-bold mb-4 text-primary text-center">สมัครนักวิ่งใหม่</h5>
                <form id="regForm">
                    <div class="mb-3">
                        <label class="small text-warning fw-bold mb-1">เลข BIB</label>
                        <input type="text" id="regBib" class="form-control text-center fw-bold bg-dark text-white border-secondary" placeholder="กรอกเลข BIB (เช่น A001, B005)" required>
                    </div>
                    <div class="mb-3">
                        <label class="small text-warning fw-bold mb-1">ชื่อเรียก หรือ ชื่อทีม</label>
                        <input type="text" id="regName" class="form-control bg-dark text-white border-secondary" placeholder="กรอกชื่อเรียก หรือ ชื่อเล่น" required>
                    </div>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label class="small text-warning fw-bold mb-1">เพศ</label>
                            <select id="regGender" class="form-select bg-dark text-white border-secondary">
                                <option value="M">ชาย</option>
                                <option value="F">หญิง</option>
                                <option value="T">ทีม</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="small text-warning fw-bold mb-1">ประเภท</label>
                            <select id="regCategory" class="form-select bg-dark text-white border-secondary">
                                <option value="Solo">Solo (เดี่ยว)</option>
                                <option value="Couple">ผลัด 2</option>
                                <option value="Team3">ผลัด 3</option>
                                <option value="Team10">ผลัด 10</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-3 shadow-sm rounded-3">บันทึกข้อมูลสมัคร</button>
                </form>
            </div>
        </div>

<div class="bottom-dashboard"><div class="container"><div class="row text-center">
    <div class="col-3"><button class="btn-dash-sm" onclick="showMsg('news')"><i class="bi bi-megaphone"></i>ข่าวสาร</button></div>
    <div class="col-3"><button class="btn-dash-sm" onclick="showMsg('staff')"><i class="bi bi-people"></i>ทีมงาน</button></div>
    <div class="col-3"><button class="btn-dash-sm btn-sos" onclick="showMsg('sos')"><i class="bi bi-heart-pulse"></i>SOS</button></div>
    <div class="col-3"><button class="btn-dash-sm" onclick="unlockVoice()"><i class="bi bi-volume-up"></i>เปิดเสียง </button></div>
</div></div></div>

<div class="modal fade" id="infoModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content bg-dark text-white border-primary rounded-4"><div class="modal-body text-center p-4"><i id="infoIcon" class="bi fs-1 text-warning"></i><h5 id="infoTitle" class="mt-3 fw-bold"></h5><p id="infoContent" class="small opacity-75"></p><button class="btn btn-warning w-100 mt-3 rounded-pill fw-bold" data-bs-dismiss="modal">ตกลง</button></div></div></div></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1KkxYzfmMQKHebhoUj_MqjhSjLXAA03bbR_Q0_vNA6b6Llowso-yN4cbfjFyoPxldEg/exec";
    const GUN_START_TIME_STR = "2026-10-16T10:00:00"; 
    let currentRunner = null, allData = [], html5QrCode = null, adminClicks = 0;

    const cpNames = { 'Start': 'จุดปล่อยตัว', 'CP1': 'หน้าบิ๊กซี สนามบิน (ทางลอด)', 'CP2': 'รพ.สต.บ้านแซว', 'CP3': 'รพ.สต.บ้านไร่', 'CP4': 'จุดชมวิวห้วยทรายมาน', 'CP5': 'วัดหาดไคร้', 'CP6': 'ศาลา 104 เชียงของ' };

    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function speak(text) { if (!window.speechSynthesis) return; window.speechSynthesis.cancel(); const msg = new SpeechSynthesisUtterance(text); msg.lang = 'th-TH'; msg.rate = 1.0; window.speechSynthesis.speak(msg); }
    function unlockVoice() { speak("ระบบเสียง อัลตร้า 104 พร้อมดูแลคุณ ไปด้วยกันนะคะ"); }
    function toggleMusic() {
        const audio = document.getElementById('bgMusic'), icon = document.getElementById('playIcon');
        if (audio.paused) { audio.play(); icon.className = "bi bi-pause-fill"; } else { audio.pause(); icon.className = "bi bi-play-fill"; }
    }

    function handleLogoClick() { adminClicks++; if(adminClicks>=5) { alert("Admin Mode"); adminClicks=0; } }

    async function verifyStep1() {
        const bib = document.getElementById('scanBib').value.trim();
        if(!bib) return;
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL); allData = await res.json();
            const runner = allData.find(r => String(r[2]) === bib && r[1] === 'REG');
            if(runner) {
                currentRunner = { bib: bib, name: runner[3], cat: runner[8], gender: runner[7] };
                document.getElementById('confirmName').innerText = runner[3];
                document.getElementById('confirmBibDisplay').innerText = "BIB: " + bib;
                showRunnerHistoryScan(bib);
                document.getElementById('scanStep1').style.display = 'none';
                document.getElementById('scanStep2').style.display = 'block';
                speak(`ยืนยันข้อมูล คุณ ${runner[3]} ค่ะ`);
            } else { alert("ไม่พบ BIB"); }
        } catch(e) { alert("เชื่อมต่อพลาด"); }
        showLoading(false);
    }

    function showRunnerHistoryScan(bib) {
        const hist = allData.filter(r => String(r[2]) === bib && r[1] === 'RUN');
        let html = '<div class="card bg-black p-3 border-secondary small mt-2"><h6 class="text-warning small fw-bold mb-2">ประวัติจุดสแกนล่าสุด</h6>';
        if(hist.length === 0) html += '<div class="opacity-50 text-center">ยังไม่มีข้อมูล</div>';
        else {
            hist.sort((a,b) => b[5] - a[5]).forEach(h => {
                const name = cpNames[h[7]] || h[7];
                html += `<div class="d-flex justify-content-between border-bottom border-secondary py-1 text-white"><span>📍 ${name}</span><span class="badge bg-primary">${h[10] || "--:--"} P</span></div>`;
            });
        }
        html += '</div>';
        document.getElementById('runnerHistoryScan').innerHTML = html;
    }

    async function unlockCPButtons() {
        const hist = allData.filter(r => String(r[2]) === currentRunner.bib && r[1] === 'RUN');
        const maxD = hist.reduce((max, r) => Math.max(max, parseFloat(r[5]) || 0), -1);
        
        document.getElementById('scanStep2').style.display = 'none';
        const s3 = document.getElementById('scanStep3'); 
        s3.style.display = 'block';
        document.getElementById('activeRunnerName').innerText = currentRunner.name;
        
        setTimeout(() => { s3.scrollIntoView({ behavior: 'smooth' }); }, 150);

        const dists = [0, 7, 56, 72, 89, 103, 104];
        const cpLabels = [
            "🚩 Start (กม.0)",
            "📍 CP-1 (กม.7 - ผ่านเลี่ยงทางลอด)",
            "📍 CP-2 (กม.56)",
            "📍 CP-3 (กม.72)",
            "📍 CP-4 (กม.89)",
            "📍 CP-5 (กม.103)",
            "🏁 Finish (กม.104)"
        ];

        document.querySelectorAll('.btn-checkpoint').forEach((btn, i) => {
            btn.classList.remove('btn-pulse');
            if (dists[i] <= maxD) { 
                btn.disabled = true; 
                btn.style.opacity = "0.3"; 
                if (i === 1) {
                    btn.innerHTML = "✅ CP-1 (ผ่านอัตโนมัติ)";
                } else {
                    btn.innerHTML = "✅ " + cpLabels[i];
                }
            }
            else if (i > 0 && dists[i-1] > maxD) { 
                btn.disabled = true; 
                btn.style.opacity = "0.1"; 
                btn.innerHTML = cpLabels[i];
            }
            else { 
                btn.disabled = false; 
                btn.style.opacity = "1"; 
                btn.innerHTML = cpLabels[i];
                btn.classList.add('btn-pulse'); 
            }
        });

        if (maxD >= 104) {
            speak(`ยินดีด้วยค่ะคุณ ${currentRunner.name} คุณเข้าเส้นชัยสำเร็จแล้ว เก่งมากค่ะ`);
        } else {
            speak(`กรุณาสแกนจุดต่อไปนะคะ`);
        }
    }

    async function scanCP(targetCP, dist) {
        const reader = document.getElementById('reader'); reader.style.display = 'block';
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        if (html5QrCode.isScanning) await html5QrCode.stop();
        speak(`สแกนจุด ${targetCP} ค่ะ`);
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
            if (text.includes(targetCP)) {
                html5QrCode.stop().then(() => { reader.style.display = 'none'; checkPoint(targetCP, dist); });
            } else { speak("ผิดจุดค่ะ"); alert("ผิดจุด!"); }
        }).catch(err => alert("เปิดกล้องไม่ได้"));
    }

    async function checkPoint(cpCode, dist) {
        showLoading(true);
        const now = new Date();
        const start = new Date(GUN_START_TIME_STR + "+07:00");
        const diffMs = now.getTime() - start.getTime(); 
        let ps = "0:00";

        if (parseFloat(dist) > 0) {
            const totalMin = (Math.abs(diffMs) / 1000) / 60;
            const paceDec = totalMin / parseFloat(dist);
            const pMin = Math.floor(paceDec);
            const pSec = Math.round((paceDec - pMin) * 60);
            ps = pMin + ":" + pSec.toString().padStart(2, '0');
        }

        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify({ action: 'record', bib: currentRunner.bib, end: cpCode, distance: dist, pace: "'" + ps }) 
            });

            if (cpCode === 'Start') {
                let cp1Pace = "0:00";
                if (7 > 0) {
                    const totalMin1 = (Math.abs(diffMs) / 1000) / 60;
                    const paceDec1 = totalMin1 / 7;
                    const pMin1 = Math.floor(paceDec1);
                    const pSec1 = Math.round((paceDec1 - pMin1) * 60);
                    cp1Pace = pMin1 + ":" + pSec1.toString().padStart(2, '0');
                }
                await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ action: 'record', bib: currentRunner.bib, end: 'CP1', distance: 7, pace: "'" + cp1Pace }) 
                });
            }

            const parts = ps.split(":");
            const minStr = parseInt(parts[0]) || 0;
            const secStr = parseInt(parts[1]) || 0;
            const runnerName = currentRunner ? currentRunner.name : "";

            let alertMsg = "";
            let speakMsg = "";

            if (cpCode === 'Start') {
                alertMsg = `บันทึกจุดปล่อยตัวสำเร็จ!\n(ระบบบันทึกจุด CP1 บิ๊กซี ให้อัตโนมัติแล้ว)`;
                speakMsg = `บันทึกจุดปล่อยตัวสำเร็จ คุณ${runnerName} ระบบบันทึกผ่านจุด ซีพี 1 ให้อัตโนมัติแล้ว สู้ๆ นะคะ`;
            } else {
                alertMsg = `บันทึกสำเร็จ! Pace: ${ps}`;
                speakMsg = `บันทึกสำเร็จ คุณ${runnerName} ระยะ ${dist} กิโลเมตร เพซ ${minStr} นาที ${secStr} วินาที สู้ๆ นะคะ`;
            }

            alert(alertMsg);
            speak(speakMsg);

            const meTabBtn = document.querySelector('button[data-bs-target="#tab-me"]');
            if (meTabBtn) {
                bootstrap.Tab.getOrCreateInstance(meTabBtn).show();
            }
            document.getElementById('meBib').value = currentRunner.bib;
            await loadMyResult();

            cancelVerify();
        } catch(e) { 
            alert("บันทึกล้มเหลว"); 
        }
        showLoading(false);
    }

    async function loadRanking() {
        showLoading(true);
        try {
            const res = await fetch(SCRIPT_URL); allData = await res.json();
            filterRanking();
        } catch(e) {}
        showLoading(false);
    }

    function filterRanking() {
        const f = document.getElementById('rankFilter').value;
        const summary = {};
        
        allData.filter(r => r[1] === 'RUN' && r[2] !== 'BIB').forEach(r => {
            const bib = String(r[2]).trim();
            const d = parseFloat(r[5]) || 0;
            
            const reg = allData.find(reg => reg[1] === 'REG' && String(reg[2]).trim() === bib);
            
            if (reg) {
                const cat = reg[8];    
                const gender = reg[9]; 
                
                if (!summary[bib] || d > summary[bib].dist) {
                    summary[bib] = { 
                        bib: bib, 
                        name: r[3], 
                        dist: d, 
                        cat: cat, 
                        gender: gender 
                    };
                }
            }
        });

        const sorted = Object.values(summary).filter(r => {
            if (f === 'All') return true;
            if (f === 'Solo_M') return (r.cat === 'Solo' && r.gender === 'M');
            if (f === 'Solo_F') return (r.cat === 'Solo' && r.gender === 'F');
            if (f === 'Couple') return (r.cat === 'Couple');
            if (f === 'Team3') return (r.cat === 'Team3');
            if (f === 'Team10') return (r.cat === 'Team10');
            return false;
        }).sort((a, b) => b.dist - a.dist);

        let html = '';
        if (sorted.length === 0) {
            html = '<tr><td colspan="4" class="text-center opacity-50">--- ยังไม่มีข้อมูลในประเภทนี้ ---</td></tr>';
        } else {
            sorted.forEach((r, i) => {
                let icon = (i === 0) ? '🥇' : (i === 1) ? '🥈' : (i === 2) ? '🥉' : i + 1;
                let rowClass = (i < 3) ? 'rank-gold' : '';
                html += `<tr class="${rowClass}">
                            <td>${icon}</td>
                            <td>${r.bib}</td>
                            <td>${r.name}<br><small class="text-muted">${r.cat}-${r.gender}</small></td>
                            <td class="text-end text-warning fw-bold">${r.dist.toFixed(1)} กม.</td>
                         </tr>`;
            });
        }
        document.getElementById('rankingBody').innerHTML = html;
    }

    async function loadMyResult() {
        const bib = document.getElementById('meBib').value.trim();
        if(!bib) return;
        showLoading(true);

        const engAudio = document.getElementById('engMusic');
        if (engAudio) {
            engAudio.volume = 0.4;
            engAudio.play().catch(e => {});
        }

        try {
            const res = await fetch(SCRIPT_URL); allData = await res.json();
            const hist = allData.filter(r => String(r[2]) === bib && r[1] === 'RUN');
            const info = allData.find(r => String(r[2]) === bib && r[1] === 'REG');
            document.getElementById('certArea').style.display = 'none';
            document.getElementById('certWrapper').style.display = 'none';
            
            if(!info) { 
                document.getElementById('meContent').innerHTML = '<p class="text-center text-white-50">ไม่พบข้อมูล BIB นี้</p>'; 
            } else {
                const maxD = hist.length ? Math.max(...hist.map(h => parseFloat(h[5]) || 0)) : 0;
                
                // 🎯 ดึงเพศ และ ประเภท จากคอลัมน์ใน Sheet ให้ถูกต้องรัดกุม
                const runnerCat = info[8] || "Solo";
                const runnerGender = info[9] || info[7] || "M";
                currentRunner = { bib: bib, name: info[3], cat: runnerCat, gender: runnerGender };
                
                if (maxD > 0) document.getElementById('certArea').style.display = 'block';

                // ⏱️ 1. คำนวณเวลารวม (Total Time) จาก Start ถึงจุดสแกนล่าสุด
                const startRow = hist.find(h => h[7] === 'Start' || h[5] == 0);
                hist.sort((a,b) => parseFloat(b[5]) - parseFloat(a[5]));
                const lastRow = hist[0];

                let totalHours = 0, totalMins = 0, totalSecs = 0;
                let totalTimeDisplay = "--:--:--";

                if (startRow && lastRow) {
                    const tStart = new Date(startRow[0]).getTime();
                    const tLast = new Date(lastRow[0]).getTime();
                    let diff = Math.max(0, tLast - tStart);

                    totalHours = Math.floor(diff / (1000 * 60 * 60));
                    diff %= (1000 * 60 * 60);
                    totalMins = Math.floor(diff / (1000 * 60));
                    diff %= (1000 * 60);
                    totalSecs = Math.floor(diff / 1000);

                    totalTimeDisplay = `${String(totalHours).padStart(2, '0')}:${String(totalMins).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
                }

                // 🏆 2. คำนวณอันดับ Live Ranking (แยก Solo-M / Solo-F / ทีม ชัดเจน)
                const summary = {};
                allData.filter(r => r[1] === 'RUN' && r[2] !== 'BIB').forEach(r => {
                    const b = String(r[2]).trim();
                    const d = parseFloat(r[5]) || 0;
                    const reg = allData.find(rg => rg[1] === 'REG' && String(rg[2]).trim() === b);
                    if (reg) {
                        const rCat = reg[8] || "Solo";
                        const rGender = reg[9] || reg[7] || "M";
                        if (!summary[b] || d > summary[b].dist) {
                            summary[b] = { bib: b, dist: d, cat: rCat, gender: rGender };
                        }
                    }
                });

                // กรองเฉพาะนักวิ่งที่อยู่ในประเภทและเพศเดียวกัน
                const sameCategoryRunners = Object.values(summary).filter(r => {
                    if (runnerCat === 'Solo') {
                        return r.cat === 'Solo' && r.gender.toUpperCase() === runnerGender.toUpperCase();
                    }
                    return r.cat === runnerCat;
                }).sort((a,b) => b.dist - a.dist);

                const myRankIndex = sameCategoryRunners.findIndex(r => r.bib === bib);
                const currentRank = (myRankIndex !== -1 && maxD > 0) ? (myRankIndex + 1) : "-";

                // ข้อความแสดงประเภทและเพศ
                let genderLabel = "";
                if (runnerCat === 'Solo') {
                    genderLabel = (runnerGender.toUpperCase() === 'F') ? "Solo (หญิง)" : "Solo (ชาย)";
                } else {
                    genderLabel = `${runnerCat}`;
                }

                // 🎯 เช็คว่าระยะทางเท่ากับหรือมากกว่า 104 กม. หรือไม่
                const is104Finish = maxD >= 104;
                const numClass = is104Finish ? "text-warning celebrate-104 fw-bold display-4" : "text-warning fw-bold display-5";

                // 🎨 การ์ดสรุปผลงานปรับปรุงใหม่ (มีเวลารวมเรียลไทม์ Total Time)
                let html = `
                <div class="p-3 bg-dark rounded-4 text-center border border-warning mb-3 shadow position-relative overflow-hidden" style="background: linear-gradient(145deg, #111111, #221c10);">
                    <div class="d-flex justify-content-between align-items-center mb-1 px-2">
                        <span class="badge bg-warning text-dark font-monospace fw-bold px-3 py-2 rounded-pill fs-6">BIB: ${bib}</span>
                        <span class="badge bg-outline-warning border border-warning text-warning px-3 py-2 rounded-pill fs-6">🏆 อันดับที่ ${currentRank}</span>
                    </div>
                    <h3 class="fw-bold text-white mt-2 mb-0">${info[3]}</h3>
                    <small class="text-warning opacity-75">ประเภท: ${genderLabel}</small>
                    <div class="my-3">
                        <h1 class="${numClass} m-0">${maxD.toFixed(1)} กม.</h1>
                        <div class="mt-2 text-info fw-bold fs-5">
                            ⏱️ เวลารวม: <span class="text-white font-monospace">${totalTimeDisplay}</span>
                        </div>
                    </div>
                </div>`;
                
                hist.sort((a,b) => b[5] - a[5]).forEach(h => {
                    const thTime = new Date(h[0]).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit' });
                    html += `<div class="history-card shadow">
                                <div class="d-flex justify-content-between">
                                    <b>📍 ${cpNames[h[7]] || h[7]}</b>
                                    <span class="badge bg-primary fs-6">${h[10] || "--:--"} P</span>
                                </div>
                                <div class="d-flex justify-content-between small mt-1">
                                    <span>🕒 ${thTime} น.</span>
                                    <span class="text-warning fw-bold">+${h[5]} กม.</span>
                                </div>
                            </div>`;
                });
                document.getElementById('meContent').innerHTML = html;

                // 🎆 🎉 ถ้าวิ่งครบ 104 กม. ยิงพลุ + ประกาศเสียงตื่นเต้น!
                if (is104Finish) {
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 120, spread: 80, origin: { y: 0.5 } });
                        setTimeout(() => confetti({ particleCount: 70, angle: 60, spread: 60, origin: { x: 0 } }), 300);
                        setTimeout(() => confetti({ particleCount: 70, angle: 120, spread: 60, origin: { x: 1 } }), 500);
                    }

                    const speakFinish = `คุณ${info[3]} คุณทำสำเร็จแล้ว 104 กิโลเมตร ระยะเวลา ${totalHours} ชั่วโมง ${totalMins} นาที ลำดับที่ ${currentRank} ยินดีด้วยค่ะ`;
                    setTimeout(() => speak(speakFinish), 600);
                }
            }
        } catch(e) {}
        showLoading(false);
    }

    // 🏆 ฟังก์ชันสร้างใบเกียรติบัตร (แยกอันดับ Solo ตามเพศ M/F แม่นยำตรงกับการ์ดผลงาน)
    async function generateCertificate() {
        const meBib = document.getElementById('meBib').value.trim();
        if(!meBib) return;

        showLoading(true);

        try {
            const res = await fetch(SCRIPT_URL); 
            allData = await res.json();

            const info = allData.find(r => String(r[2]) === meBib && r[1] === 'REG');
            const hist = allData.filter(r => String(r[2]) === meBib && r[1] === 'RUN');

            if (!info) {
                alert("ไม่พบข้อมูลนักวิ่ง");
                showLoading(false);
                return;
            }

            const fullName = (info[4] && info[4] !== '-') ? info[4] : info[3];
            const runnerName = fullName || "นักวิ่ง";
            const runnerCat = info[8] || "Solo";
            const runnerGender = (info[9] || info[7] || "M").toUpperCase(); // ดึงค่าเพศรัดกุม

            // 🎯 ระยะทางสูงสุดที่ทำได้จริง ณ จุดสแกนล่าสุด
            const maxD = hist.length ? Math.max(...hist.map(h => parseFloat(h[5]) || 0)) : 0;

            // --- 1. คำนวณเวลารวม ---
            const startRow = hist.find(h => h[7] === 'Start' || h[5] == 0);
            
            hist.sort((a,b) => parseFloat(b[5]) - parseFloat(a[5]));
            const lastRow = hist[0];

            let totalHours = 0, totalMins = 0, totalSecs = 0;
            let timeStr = "00:00:00";

            if (startRow && lastRow) {
                const tStart = new Date(startRow[0]).getTime();
                const tLast = new Date(lastRow[0]).getTime();
                let diff = Math.max(0, tLast - tStart);

                totalHours = Math.floor(diff / (1000 * 60 * 60));
                diff %= (1000 * 60 * 60);
                totalMins = Math.floor(diff / (1000 * 60));
                diff %= (1000 * 60);
                totalSecs = Math.floor(diff / 1000);

                timeStr = `${String(totalHours).padStart(2, '0')}:${String(totalMins).padStart(2, '0')}:${String(totalSecs).padStart(2, '0')}`;
            }

            // --- 2. คำนวณลำดับ Rank แยกตามประเภทและเพศ (Solo-M / Solo-F) ---
            const summary = {};
            allData.filter(r => r[1] === 'RUN' && r[2] !== 'BIB').forEach(r => {
                const b = String(r[2]).trim();
                const d = parseFloat(r[5]) || 0;
                const reg = allData.find(rg => rg[1] === 'REG' && String(rg[2]).trim() === b);
                if (reg) {
                    const rCat = reg[8] || "Solo";
                    const rGender = (reg[9] || reg[7] || "M").toUpperCase();
                    if (!summary[b] || d > summary[b].dist) {
                        summary[b] = { bib: b, dist: d, cat: rCat, gender: rGender };
                    }
                }
            });

            // กรองกลุ่มเดียวกันเป๊ะๆ (Solo ต้องเช็คเพศตรงกัน)
            const sameCategoryRunners = Object.values(summary).filter(r => {
                if (runnerCat === 'Solo') {
                    return r.cat === 'Solo' && r.gender === runnerGender;
                }
                return r.cat === runnerCat;
            }).sort((a,b) => b.dist - a.dist);

            const myRankIndex = sameCategoryRunners.findIndex(r => r.bib === meBib);
            const rankNum = (myRankIndex !== -1 && maxD > 0) ? (myRankIndex + 1) : 1;
            const rankStr = `Rank ${rankNum}`;

            // --- 3. คำนวณ Pace เฉลี่ย/ล่าสุด ---
            let avgPaceStr = "0:00";
            if (lastRow && lastRow[10] && lastRow[10] !== '-') {
                avgPaceStr = String(lastRow[10]).replace("'", "");
            }

            // --- 4. วาดภาพ Canvas ลงบนใบเกียรติบัตร ---
            const canvas = document.getElementById('certCanvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = 'certificate_bg.png';

            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                ctx.fillStyle = "#FFD700";
                ctx.textAlign = "left";
                ctx.font = "bold 75px Prompt, sans-serif";

                // พิกัดจูนตำแหน่งข้อความบนภาพ
                ctx.fillText(meBib, 160, 440);          // BIB
                ctx.fillText(runnerName, 420, 440);     // ชื่อนักวิ่ง
                
                // 🚩 แสดงประเภทแยกเพศ + ระยะทางจริง (เช่น SOLO-M (7.0 KM) หรือ SOLO-F (7.0 KM))
                let catLabel = runnerCat.toUpperCase();
                if (runnerCat === 'Solo') {
                    catLabel = (runnerGender === 'F') ? "SOLO-F" : "SOLO-M";
                }
                const catWithDist = `${catLabel} (${maxD.toFixed(1)} KM)`;
                ctx.fillText(catWithDist, 1550, 440);

                ctx.fillText(rankStr, 160, 600);        // ลำดับ Rank (ตรงกับการ์ดสรุปเป๊ะ)
                ctx.fillText(`Time ${timeStr}`, 650, 600);  // เวลารวม
                ctx.fillText(`Pace ${avgPaceStr}`, 1400, 600); // Pace

                const dataURL = canvas.toDataURL("image/png");
                const finalImg = new Image();
                finalImg.src = dataURL;
                finalImg.style.width = "100%";
                finalImg.style.borderRadius = "15px";

                const wrapper = document.getElementById('certWrapper');
                canvas.style.display = 'none';

                const oldImg = wrapper.querySelector('img');
                if(oldImg) oldImg.remove();
                wrapper.insertBefore(finalImg, wrapper.querySelector('p'));

                wrapper.style.display = 'block';
                wrapper.scrollIntoView({ behavior: 'smooth' });

                // 🎆 5. ยิงพลุฉลองชัย
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    setTimeout(() => confetti({ particleCount: 50, angle: 60, spread: 55, origin: { x: 0 } }), 250);
                    setTimeout(() => confetti({ particleCount: 50, angle: 120, spread: 55, origin: { x: 1 } }), 400);
                }

                // 🎙️ 6. เสียง AI ประกาศฉลองชัย
                let speakMsg = "";
                if (maxD >= 104) {
                    speakMsg = `ยินดีกับความสำเร็จ ChiangKhong Ultra Marathon ของคุณ${runnerName} คุณวิ่งได้ 104 กิโลเมตร เวลา ${totalHours} ชั่วโมง ${totalMins} นาที ${totalSecs} วินาที ได้ลำดับที่ ${rankNum} คุณ${runnerName} คุณเก่งมากค่ะ`;
                } else {
                    speakMsg = `ขอแสดงความยินดีกับความทุ่มเทใน ChiangKhong Ultra Marathon ของคุณ${runnerName} คุณวิ่งได้ระยะทาง ${maxD.toFixed(0)} กิโลเมตร เวลา ${totalHours} ชั่วโมง ${totalMins} นาที ได้ลำดับที่ ${rankNum} คุณ${runnerName} คุณเก่งมากค่ะ`;
                }
                
                setTimeout(() => {
                    speak(speakMsg);
                }, 500);

                showLoading(false);
            };

            img.onerror = function() {
                alert("ไม่สามารถโหลดไฟล์ภาพ certificate_bg.png ได้");
                showLoading(false);
            };

        } catch(e) {
            alert("เกิดข้อผิดพลาดในการสร้างใบประกาศ");
            showLoading(false);
        }
    }

        document.getElementById('scanStep1').style.display = 'block';
        document.getElementById('scanStep2').style.display = 'none';

    // 🚀 ระบบ Event Listener หลัก (รวมศูนย์สมบูรณ์แบบ)
    window.addEventListener('load', () => {
        // 1. ระบบสมัครนักวิ่ง + ตรวจสอบ BIB ซ้ำ
        const regForm = document.getElementById('regForm');
        if (regForm) {
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                showLoading(true);

                const bib = document.getElementById('regBib').value.trim();
                const name = document.getElementById('regName').value.trim();
                const gender = document.getElementById('regGender').value;
                const category = document.getElementById('regCategory').value;

                try {
                    const res = await fetch(SCRIPT_URL);
                    allData = await res.json();

                    const isDuplicate = allData.some(r => r[1] === 'REG' && String(r[2]).trim().toUpperCase() === bib.toUpperCase());

                    if (isDuplicate) {
                        const dupRunner = allData.find(r => r[1] === 'REG' && String(r[2]).trim().toUpperCase() === bib.toUpperCase());
                        const dupName = dupRunner ? dupRunner[3] : "";

                        alert(`⚠️ เลข BIB ${bib} นี้ถูกลงทะเบียนไปแล้ว!\n(ชื่อ: ${dupName})`);
                        speak(`เลขบิบ ${bib} นี้ถูกลงทะเบียนไปแล้วค่ะ กรุณาตรวจสอบเลขบิบอีกครั้งค่ะ`);
                        showLoading(false);
                        return;
                    }

                    const data = { 
                        action: 'register', 
                        bib: bib, 
                        name: name, 
                        gender: gender, 
                        category: category 
                    };

                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify(data) 
                    });

                    speak(`ลงทะเบียนสำเร็จแล้วค่ะ คุณ ${name} บิบ ${bib} สแกนจุดสตาร์ทได้เลยค่ะ`);
                    alert("สมัครสำเร็จ!"); 
                    location.reload();

                } catch(e) {
                    alert("เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
                }
                showLoading(false);
            });
        }

        // 2. ระบบเพลง 104 Eng ควบคุมเมื่อสลับแท็บ
        const engAudio = document.getElementById('engMusic');
        const tabButtons = document.querySelectorAll('button[data-bs-toggle="pill"]');
        
        tabButtons.forEach(button => {
            button.addEventListener('shown.bs.tab', (event) => {
                const targetTab = event.target.getAttribute('data-bs-target');

                if (targetTab === '#tab-me') {
                    if (engAudio) {
                        engAudio.volume = 0.4;
                        engAudio.play().catch(e => {});
                    }
                } else {
                    if (engAudio) {
                        engAudio.pause();
                        engAudio.currentTime = 0;
                    }
                }
            });
        });
    });
